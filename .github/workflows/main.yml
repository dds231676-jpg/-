name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/system/update
          cp MainActivity.java app/src/main/java/com/system/update/
          cp AndroidManifest.xml app/src/main/
          cd app
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }" > build.gradle
          echo "apply plugin: 'com.android.application'" >> build.gradle
          echo "android { namespace 'com.system.update'; compileSdk 33; defaultConfig { applicationId 'com.system.update'; minSdk 26; targetSdk 33; versionCode 1; versionName '1.0' } }" >> build.gradle
          cd ..
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: app/build/outputs/apk/debug/app-debug.apk
